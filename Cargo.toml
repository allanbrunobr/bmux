[package]
name = "bmux"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
description = "BMUX — AI-powered terminal multiplexer with agent orchestration"
authors = ["Bruno Oliveira Silva"]
license = "MIT"

[[bin]]
name = "bmux"
path = "src/main.rs"

[lib]
name = "bmux"
path = "src/lib.rs"

[dependencies]
# TUI
ratatui = "0.28"
crossterm = { version = "0.27", features = ["event-stream"] }
portable-pty = "0.8"
vt100 = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Config
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Storage
sled = "0.34"

# IPC / security
uuid = { version = "1", features = ["v4"] }
ring = "0.17"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Async trait
async-trait = "0.1"

# Misc
bytes = "1"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2.183"
dirs = "6.0.0"
which = "8.0.2"
tabled = "0.20.0"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
serial_test = "3.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
