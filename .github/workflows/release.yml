# .github/workflows/release.yml — Release pipeline
# Story 7.1: Cargo Install & CI Build Pipeline
#
# Triggered when a semver tag (v*) is pushed.
# Builds pre-compiled binaries for all 4 targets, uploads to GitHub Release,
# and publishes SHA256 checksums alongside each binary.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: bmux

permissions:
  contents: write  # needed to create GitHub Release and upload assets

jobs:
  # ─── Build binaries for each target ─────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
            asset_suffix: linux-x86_64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
            asset_suffix: linux-aarch64

          - target: x86_64-apple-darwin
            runner: macos-13           # Intel macOS runner
            use_cross: false
            asset_suffix: macos-x86_64

          - target: aarch64-apple-darwin
            runner: macos-latest       # Apple Silicon macOS runner
            use_cross: false
            asset_suffix: macos-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe in build.rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build with cargo
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          ASSET="${{ env.BINARY_NAME }}-${{ matrix.asset_suffix }}"
          cp "$BINARY" "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256" 2>/dev/null || \
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  # ─── Create GitHub Release & attach assets ───────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact files
        run: |
          mkdir -p dist
          find artifacts -type f | xargs -I{} cp {} dist/

      - name: Generate combined checksums file
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          echo "=== SHA256SUMS ===" && cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BMUX ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/bmux-*
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Publish to crates.io ─────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
